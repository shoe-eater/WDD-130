<!DOCTYPE html>

<head>

    <title>WDD 130 Homework</title>
    <style>
        body {
            justify-items: center;
            display: grid;
            grid-template-rows: 1fr 1fr;

        }
        header {
            display: flex;
            width:100%;

        h1 {
            text-align: center;

            border-style: solid;
            border-width: 5px;
            border-color: black;

            color: blue;
            text-align: center;
        }
        #white-water-rafting {
            color: green;
            text-align: center;
        }

            color: orange;
        }
        .orange-link:hover {
            color: orangered;
        }
        .card {
            background-color: paleturquoise;
            width: 80%;
            border-style: solid;
            border-width: 5px;
            border-color: black;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .card-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        nav {
            display: flex;
            justify-content: space-around;
        }
    </style>
</head>

        <div class="card">

            <ul>
                <li>
